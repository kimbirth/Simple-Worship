name: Package Windows signing input

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build unsigned signing input
        run: npm run build:win:unsigned

      - name: Upload signing input
        uses: actions/upload-artifact@v7
        with:
          name: simpleworship-windows-unsigned
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
